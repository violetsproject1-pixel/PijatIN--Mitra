name: Build APK Mitra
on:
  push:
    branches: [ main ]
jobs:
  build:
    name: Build APK GOLD LOTUS Mitra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK Mitra REALTIME
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Mitra
        uses: actions/upload-artifact@v4
        with:
          name: PijatIN-Mitra-REALTIME-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
